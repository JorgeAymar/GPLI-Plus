# itsm (GLPI-Plus) production stack, plain Docker Compose (no Swarm).
#
# Moved off Swarm on 2026-10-10: Swarm mode is incompatible with the Docker
# daemon's `live-restore` option, which keeps containers running across daemon
# restarts. Deploy with ./scripts/deploy.sh (builds both images tagged with the
# short git SHA, then `docker compose up -d`).
#
# Secrets: DATABASE_URL, SMTP_PASSWORD and AI_API_KEY reach the worker as files
# under /run/secrets (compose file-based secrets, generated by deploy.sh into
# ./secrets/ from .env.production, mode 600), read at startup by
# apps/worker/src/load-secrets.ts through the *_FILE variables below. The
# worker's non-secret settings come from .env.worker (also derived by deploy.sh).
#
# One-time setup, first install and update instructions: see README.md,
# "Producción (instalación on-premise vía Docker)".

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - itsm_postgres_data:/var/lib/postgresql/data
    networks:
      - itsm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 512m

  web:
    # IMAGE_TAG is set by scripts/deploy.sh to the short git SHA of the build
    # being deployed; defaults to "latest" for manual `IMAGE_TAG=... docker
    # compose up -d` invocations.
    image: itsm-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-3000}:3000"
    networks:
      - itsm_internal
    volumes:
      # STORAGE_LOCAL_PATH (.env.production, default "./.data/documents")
      # resolves relative to the container's WORKDIR (/app) -> /app/.data/documents.
      # Without this volume every deploy would destroy ticket/asset attachments.
      - itsm_documents_data:/app/.data/documents
    mem_limit: 1024m
    memswap_limit: 1024m

  worker:
    image: itsm-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.worker
    environment:
      DATABASE_URL_FILE: /run/secrets/itsm_database_url
      SMTP_PASSWORD_FILE: /run/secrets/itsm_smtp_password
      AI_API_KEY_FILE: /run/secrets/itsm_ai_api_key
    secrets:
      - itsm_database_url
      - itsm_smtp_password
      - itsm_ai_api_key
    networks:
      - itsm_internal
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m

secrets:
  itsm_database_url:
    file: ./secrets/itsm_database_url
  itsm_smtp_password:
    file: ./secrets/itsm_smtp_password
  itsm_ai_api_key:
    file: ./secrets/itsm_ai_api_key

networks:
  itsm_internal:
    driver: bridge
    # Explicit subnet: this host runs ~50 other Docker networks and the default
    # auto-allocated address pool was exhausted once; this subnet is confirmed free.
    ipam:
      config:
        - subnet: 10.10.30.0/24

volumes:
  # Existing named volumes created by the former Swarm stack (keep the data).
  itsm_postgres_data:
    external: true
    name: itsm_itsm_postgres_data
  itsm_documents_data:
    external: true
    name: itsm_itsm_documents_data
